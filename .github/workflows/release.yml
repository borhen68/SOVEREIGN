name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build container
        run: docker build -t sovereign:${{ github.ref_name }} .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container to GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/sovereign
          docker tag sovereign:${{ github.ref_name }} ${IMAGE}:${{ github.ref_name }}
          docker tag sovereign:${{ github.ref_name }} ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.ref_name }}
          docker push ${IMAGE}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
